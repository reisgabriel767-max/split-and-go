services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: splitgo
      POSTGRES_PASSWORD: splitgo_local
      POSTGRES_DB: splitgo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - splitgo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitgo -d splitgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitgo_data:
